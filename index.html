<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Neegy Clicker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
:root{color-scheme:dark;--bg:#0b0907;--p:#17130c;--p2:#241c0d;--g:#ffd23f;--g2:#c99a12;--t:#f5ecd2;--m:#a39673;--ok:#7be87f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#33260a,var(--bg) 55%) fixed var(--bg);color:var(--t);font:15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
h1,h2,#bank{font-family:"Lilita One",Impact,"Arial Black",sans-serif;font-weight:400;margin:0}
header{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:2px solid var(--g2);background:var(--p)}
.logo{width:54px;height:54px;border-radius:10px;border:2px solid var(--g)}
h1{font-size:30px;letter-spacing:.5px;background:linear-gradient(90deg,#fff2a8,#ffc800,#b8860b,#ffc800,#fff2a8) 0 0/200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}@keyframes sh{to{background-position:200%}}
#tick{color:var(--m);font-size:13px;min-height:18px}
main{display:grid;grid-template-columns:minmax(260px,1fr) minmax(280px,1.1fr) minmax(280px,1fr);gap:12px;padding:12px;max-width:1300px;margin:auto}
section{background:var(--p);border:1px solid #3a2e12;border-radius:14px;padding:12px}
h2{font-size:20px;color:var(--g);margin:6px 0 8px}
#L{text-align:center}
#bank{font-size:34px;color:var(--g);text-shadow:0 2px 0 #5b3f00}
#cps{color:var(--m);margin-bottom:6px}
#neegy{width:100%;aspect-ratio:1;border-radius:50%;border:0;padding:0;background:#000;cursor:pointer;touch-action:manipulation;box-shadow:0 0 0 4px var(--g2),0 0 calc(40px + var(--gl,0) * 1.4px) color-mix(in srgb,var(--g) 45%,transparent);transition:transform .06s;animation:bob 4s ease-in-out infinite;overflow:hidden}
#neegy:active{transform:scale(.94)}
#neegy img{width:100%;height:100%;object-fit:cover;pointer-events:none}
@keyframes bob{50%{translate:0 -6px}}
#buffs{min-height:44px;margin-top:10px;display:grid;gap:4px}
#buffs b{background:var(--p2);border:1px solid var(--g2);border-radius:8px;padding:4px 8px;color:var(--g)}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--p2);border:1px solid #3a2e12;border-radius:10px;color:var(--t);padding:8px 10px;margin-bottom:6px;cursor:pointer;font:inherit}
.row:hover{border-color:var(--g)}
.row.off{opacity:.45}
.ic{display:grid;place-items:center}.cn svg,.nm svg{vertical-align:middle}
.nm b{display:block}
.nm small{color:var(--m)}
.row.can .nm small.c{color:var(--ok)}
.cn{font:26px "Lilita One",Impact,sans-serif;color:var(--g2)}
#amt{display:flex;gap:6px;margin-bottom:8px}
button.tg,.bt{background:var(--p2);color:var(--t);border:1px solid #3a2e12;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
button.tg.on{background:var(--g);color:#201600;border-color:var(--g);font-weight:700}
#ach{display:flex;flex-wrap:wrap;gap:5px}
#ach i{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:var(--p2);color:var(--m);font-style:normal;cursor:pointer}
#ach i.on{background:#4a3606;box-shadow:inset 0 0 0 1px var(--g)}
.mu{color:var(--m)}
#opts{display:flex;flex-wrap:wrap;gap:6px}
#io{width:100%;height:50px;background:var(--p2);color:var(--t);border:1px solid #3a2e12;border-radius:8px;margin-top:6px;user-select:text;-webkit-user-select:text}
#stats{display:grid;grid-template-columns:1fr auto;gap:2px 10px;color:var(--m);margin-top:6px}
#stats span:nth-child(even){color:var(--t);text-align:right}
.mascot{display:block;height:150px;margin:8px auto 0;border-radius:10px}
#toast{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:6px;pointer-events:none;z-index:20}
#toast div{background:#2a2008;border:1px solid var(--g);border-radius:10px;padding:8px 14px;max-width:92vw;animation:tin .25s}
@keyframes tin{from{translate:0 14px;opacity:0}}
.fl{position:fixed;pointer-events:none;font:22px "Lilita One",Impact,sans-serif;color:var(--g);text-shadow:0 2px 0 #000;animation:up .9s forwards;z-index:15;translate:-50% -50%}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
#gold{position:fixed;width:76px;height:76px;border-radius:50%;border:3px solid #fff3b0;padding:0;overflow:hidden;background:#000;cursor:pointer;z-index:12;box-shadow:0 0 30px 8px #ffd23f;animation:pulse 1s infinite alternate}
#gold img{width:100%;height:100%;object-fit:cover;pointer-events:none}
@keyframes pulse{to{scale:1.12}}
#wrap{position:relative;width:min(300px,80vw);margin:26px auto 8px}#orb{position:absolute;inset:0;--r:calc(min(300px,80vw)/2 + 15px);animation:spin 40s linear infinite;pointer-events:none}@keyframes spin{to{transform:rotate(360deg)}}
.of{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px}.of svg{rotate:180deg;display:block}
#say{min-height:26px;color:var(--g);font-style:italic}
#army{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}#army i{width:26px;height:26px;border-radius:50%;background:var(--face) center/cover #000;border:1.5px solid var(--g2)}
.bp{position:fixed;pointer-events:none;z-index:15;animation:fly .7s ease-out forwards}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(240deg);opacity:0}}
@media(max-width:900px){main{grid-template-columns:1fr}#M{order:3}#tabs{display:flex}body{padding-bottom:72px}#toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}main[data-t=L] #M,main[data-t=L] #R,main[data-t=R] #L,main[data-t=R] #M,main[data-t=M] #L,main[data-t=M] #R,main[data-t=M] #C,main[data-t=L] #C,main[data-t=R] #C,main[data-t=C] #L,main[data-t=C] #R,main[data-t=C] #M{display:none}}
#tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:18;background:var(--p);border-top:2px solid var(--g2);padding-bottom:env(safe-area-inset-bottom,0px)}#tabs button{flex:1;background:none;border:0;color:var(--m);font:20px "Lilita One",Impact,sans-serif;padding:14px 0}#tabs button.on{color:var(--g)}#tabs button.dot::after{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-left:6px}
#C{grid-column:1/-1}#city{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lot{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:136px;background:linear-gradient(#17120a,#33280f);border:1px solid #3a2e12;border-bottom:5px solid #5a7a35;border-radius:10px;color:var(--t);padding:6px 2px;font:inherit;cursor:pointer;text-align:center}
.lot b{font-size:13px}.lot small.c{color:var(--m);font-size:11px}.lot.can small.c{color:var(--ok)}.lot.off{opacity:.55}.lot.max{border-color:var(--g);opacity:1}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}header,main{position:relative;z-index:1}.row{transition:transform .12s,border-color .12s}.row:active,.lot:active{transform:scale(.97)}
#dc{margin-left:auto;display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:#5865f2;border-color:#5865f2;color:#fff;font-weight:700;white-space:nowrap}a.bt{text-decoration:none;display:inline-block}#autoc{display:flex;gap:6px;margin-bottom:8px;align-items:stretch}#autoc .row{margin:0;flex:1}#autoc .tg{width:92px}#neegy.ap{transform:scale(.96)}
@media(min-width:901px){#tabs{display:none}}.rb{animation:hue 4s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#neegy,#gold,#orb,h1{animation:none}}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style></head><body><svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset=".5" stop-color="#ffc800"/><stop offset="1" stop-color="#b8860b"/></linearGradient></defs></svg><canvas id="bg"></canvas>

const PROMO_KEY = "neegy_promos_used";
function getUsedPromos(){try{return JSON.parse(localStorage.getItem(PROMO_KEY)||"[]")}catch(e){return []}}
function markPromoUsed(code){const u=getUsedPromos();if(!u.includes(code)){u.push(code);localStorage.setItem(PROMO_KEY,JSON.stringify(u))}}
// Built-in + bot-generated style codes. Format from bot: NEEGY-XXXXXX or custom
const PROMO_CODES = {
  "WELCOME": {n: 50000, name: "Welcome bonus"},
  "NEEGY100K": {n: 100000, name: "100k promo"},
  "GOLDEN": {n: 1000000, name: "Golden Neegy"},
  "REBIRTH": {n: 5000000, name: "Rebirth starter"},
  "BLACKSKIN": {n: 5e18, name: "Black Neegy help"}
};
const PROMO_API = "https://neegycode123.onrender.com";

const AUTH_API = PROMO_API;
let authToken = localStorage.getItem("neegy_auth") || "";
let currentUser = null;

function updateAuthUI(){
  const loginBtn = $("#loginBtn");
  const discordBtn = $("#discordBtn");
  const pfp = $("#userPfp");
  const nameEl = $("#userName");
  if(currentUser){
    loginBtn.style.display = "none";
    discordBtn.style.display = "none";
    pfp.style.display = "block";
    pfp.src = currentUser.avatar || "";
    nameEl.style.display = "inline";
    nameEl.textContent = currentUser.username;
  } else {
    loginBtn.style.display = "inline-block";
    discordBtn.style.display = "inline-block";
    pfp.style.display = "none";
    nameEl.style.display = "none";
  }
}

async function checkAuth(){
  const params = new URLSearchParams(location.search);
  const newToken = params.get("auth");
  if(newToken){
    authToken = newToken;
    localStorage.setItem("neegy_auth", authToken);
    history.replaceState({}, "", location.pathname);
  }
  if(!authToken){ updateAuthUI(); return; }
  try{
    const r = await fetch(AUTH_API+"/auth/me?token="+authToken);
    const data = await r.json();
    if(data.ok){
      currentUser = data;
      updateAuthUI();
      if(!data.hasPassword){
        setTimeout(askPassword, 800);
      }
    } else {
      localStorage.removeItem("neegy_auth");
      authToken = "";
      updateAuthUI();
    }
  }catch(e){ updateAuthUI(); }
}

function askPassword(){
  const pw = prompt("Create a strong password (at least 8 characters) for your account:");
  if(!pw || pw.length < 8){
    alert("Password must be at least 8 characters.");
    setTimeout(askPassword, 500);
    return;
  }
  fetch(AUTH_API+"/auth/setpassword", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({token:authToken, password:pw})
  }).then(r=>r.json()).then(d=>{
    if(d.ok) toast("Password set!");
    else alert(d.error || "Failed to set password");
  }).catch(()=>alert("Could not set password"));
}

$("#discordBtn").onclick = ()=> location.href = "https://discord.com/oauth2/authorize?client_id=1565260351271075942&response_type=code&redirect_uri=https%3A%2F%2Fneegycode123.onrender.com%2Fauth%2Fdiscord%2Fcallback&scope=identify+guilds.join";
$("#loginBtn").onclick = ()=>{
  const username = prompt("Username:");
  if(!username) return;
  const password = prompt("Password:");
  if(!password) return;
  fetch(AUTH_API+"/auth/login", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username, password})
  }).then(r=>r.json()).then(d=>{
    if(d.ok){
      authToken = d.token;
      localStorage.setItem("neegy_auth", authToken);
      currentUser = d;
      updateAuthUI();
      toast("Logged in!");
    } else alert("Invalid username or password");
  }).catch(()=>alert("Login failed"));
};

async function redeemPromo(raw){
  const code = (raw||"").trim().toUpperCase().replace(/\s+/g,"");
  if(!code){toast("Enter a code");return}
  const used = getUsedPromos();
  if(used.includes(code)){toast("You already used this code");sfx("err");return}

  let reward = PROMO_CODES[code];
  if(reward){
    add(reward.n);
    markPromoUsed(code);
    toast("Redeemed "+reward.name+"! +"+f(reward.n)+" Neegies","clover");
    sfx("lucky");
    render();
    const msg = $("#promoMsg");
    if(msg) msg.textContent = "Code redeemed! +"+f(reward.n)+" Neegies";
    return;
  }

  const msgEl = $("#promoMsg");
  if(msgEl) msgEl.textContent = "Checking code...";
  try{
    const r = await fetch(PROMO_API+"/check?code="+encodeURIComponent(code), {mode:"cors"});
    if(!r.ok) throw new Error("bad status");
    const data = await r.json();
    if(!data.valid){
      toast(data.reason || "Invalid or expired code");
      sfx("err");
      if(msgEl) msgEl.textContent = data.reason || "Invalid code";
      return;
    }
    add(data.amount);
    markPromoUsed(code);
    toast("Redeemed Discord promo! +"+f(data.amount)+" Neegies","clover");
    sfx("lucky");
    render();
    if(msgEl) msgEl.textContent = "Code redeemed! +"+f(data.amount)+" Neegies";
  }catch(e){
    console.error(e);
    toast("Could not reach promo server");
    sfx("err");
    if(msgEl) msgEl.textContent = "Server error — try again later";
  }
}

let AC,MG,VOL=.6;
function ctx(){if(!AC){AC=new AudioContext();MG=AC.createGain();MG.gain.value=VOL;const c=AC.createDynamicsCompressor();MG.connect(c);c.connect(AC.destination)}if(AC.state==="suspended")AC.resume();return AC}
function tone(f,t0,d,ty,v,f2){const a=ctx(),o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(MG);o.start(t0);o.stop(t0+d+.05)}
function noise(t0,d,v,fq){const a=ctx(),n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type="bandpass";f.frequency.value=fq;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f);f.connect(g);g.connect(MG);s.start(t0)}
function sfx(n){if(!snd)return;try{const a=ctx(),t=a.currentTime;
if(n==="click"){tone(480*(1+Math.min(cb,100)/120)+Math.random()*60,t,.09,"triangle",.14,180);noise(t,.04,.05,4500)}
else if(n==="buy"){tone(988,t,.1,"square",.06);tone(1318,t+.08,.28,"square",.06);noise(t,.05,.03,6000)}
else if(n==="up"){[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.07,.3,"triangle",.1))}
else if(n==="ach"){[523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*.09,.5,"sine",.12));tone(262,t,.8,"triangle",.1)}
else if(n==="gold"||n==="lucky"){for(let i=0;i<7;i++)tone(1320*2**(i/6),t+i*.06,.4,"sine",.07)}
else if(n==="city"){tone(130,t,.3,"sine",.3,40);noise(t,.15,.12,500);tone(660,t+.12,.2,"triangle",.08)}
else if(n==="tick")tone(700,t,.04,"square",.04);
else if(n==="err")tone(160,t,.18,"sawtooth",.06,90)}catch(e){}}
const CH=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],mf=m=>440*2**((m-69)/12);let st=0;
setInterval(()=>{if(!mus||!snd)return;try{const a=ctx(),t=a.currentTime,ch=CH[(st>>3)%4],s=st%8;if(s===0){ch.forEach(m=>tone(mf(m-12),t,2.3,"triangle",.05));tone(mf(ch[0]-24),t,2.3,"sine",.12)}tone(mf(ch[[0,1,2,1,2,1,0,2][s]]+12),t,.5,"triangle",.05);if(s%2)noise(t,.03,.02,7000);st++}catch(e){}},300);
