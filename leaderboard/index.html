<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neegy Leaderboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
:root{color-scheme:dark;--bg:#0b0907;--p:#17130c;--g:#ffd23f;--t:#f5ecd2;--m:#a39673}
body{margin:0;background:#0b0907;color:var(--t);font:16px/1.4 system-ui,sans-serif;padding:20px}
h1{font-family:"Lilita One",Impact,sans-serif;color:var(--g);text-align:center;margin:10px 0 20px}
table{width:100%;max-width:600px;margin:auto;border-collapse:collapse;background:var(--p);border-radius:12px;overflow:hidden}
th,td{padding:12px 16px;text-align:left}
th{background:#241c0d;color:var(--g);font-family:"Lilita One",sans-serif}
tr:nth-child(even){background:#1f180e}
.rank{font-weight:bold;color:var(--g);width:50px}
.neegies{text-align:right;font-variant-numeric:tabular-nums}
.back{display:block;text-align:center;margin:20px auto;color:var(--g);text-decoration:none}
</style>
</head>
<body>
<h1>Neegy Leaderboard</h1>
<table>
<thead><tr><th>#</th><th>Name</th><th class="neegies">Neegies</th></tr></thead>
<tbody id="body"></tbody>
</table>
<a class="back" href="/">← Back to game</a>
<script>
const API = "https://neegycode123.onrender.com";
async function load(){
  try{
    const r = await fetch(API+"/leaderboard.json");
    const data = await r.json();
    const sorted = Object.entries(data).sort((a,b)=>b[1].neegies-a[1].neegies).slice(0,100);
    const fmt = n => {
      const abs = Math.abs(n);
      if(abs>=1e15)return (n/1e15).toFixed(2)+"Q";
      if(abs>=1e12)return (n/1e12).toFixed(2)+"T";
      if(abs>=1e9)return (n/1e9).toFixed(2)+"B";
      if(abs>=1e6)return (n/1e6).toFixed(2)+"M";
      if(abs>=1e3)return (n/1e3).toFixed(2)+"K";
      return n.toLocaleString();
    };
    document.getElementById("body").innerHTML = sorted.map(([name,s],i)=>`
      <tr><td class="rank">${i+1}</td><td>${name}</td><td class="neegies">${fmt(s.neegies)}</td></tr>
    `).join("") || "<tr><td colspan='3' style='text-align:center'>No scores yet</td></tr>";
  }catch(e){
    document.getElementById("body").innerHTML = "<tr><td colspan='3' style='text-align:center'>Could not load</td></tr>";
  }
}
load();
setInterval(load, 15000);
</script>
</body>
</html>
